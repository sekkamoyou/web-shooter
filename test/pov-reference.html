<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Author POV reference</title><style>body{margin:0;background:#454d51;color:#eee;font:13px sans-serif;overflow:hidden}nav{position:fixed;z-index:2;top:10px;left:10px;display:flex;gap:5px}button{padding:10px;border:0;background:#e9e7dd}#info{position:fixed;bottom:12px;left:12px}</style><nav><button data-clip="Pistol_IDLE">Original idle</button><button data-clip="Pistol_FIRE">Original fire</button><button data-clip="Pistol_RELOAD">Original reload</button></nav><div id="info">Loading author reference…</div><script type="module">
import {Scene,PerspectiveCamera,WebGLRenderer,HemisphereLight,DirectionalLight,AnimationMixer,LoopRepeat,ACESFilmicToneMapping,Color} from 'three';import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
const scene=new Scene();scene.background=new Color('#454d51');const camera=new PerspectiveCamera(50,innerWidth/innerHeight,.01,100);camera.position.set(.028,2.237,-1.033);camera.rotation.y=Math.PI;
const renderer=new WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=ACESFilmicToneMapping;document.body.append(renderer.domElement);scene.add(new HemisphereLight('#e1e9ee','#82735b',1.7));const key=new DirectionalLight('#ffe3bd',2.2);key.position.set(-2,3,-2);scene.add(key);
const gltf=await new GLTFLoader().loadAsync('../models/weapons/animated-pistol/scene.gltf');scene.add(gltf.scene);const mixer=new AnimationMixer(gltf.scene);
function play(name){mixer.stopAllAction();mixer.clipAction(gltf.animations.find(c=>c.name===name)).reset().setLoop(LoopRepeat,Infinity).play();mixer.update(0);document.querySelector('#info').textContent='ImageParSeconde · Original camera (.028, 2.237, -1.033), yaw 180°, FOV 50° · '+name;}
for(const b of document.querySelectorAll('[data-clip]'))b.onclick=()=>play(b.dataset.clip);play('Pistol_IDLE');let last=performance.now();function frame(){requestAnimationFrame(frame);const now=performance.now();mixer.update(Math.min((now-last)/1000,.05));last=now;renderer.render(scene,camera);}frame();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
